<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  /* hidden falls back if the browser does not support clip;
     clip avoids creating a scroll container so position:sticky works. */
  overflow-x:hidden;
  overflow-x:clip;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Apple SD Gothic Neo",
    "Noto Sans KR",
    sans-serif;

  background:#fffaf6;
  color:#2f2a26;
}

/* ===== Intro: stacked crossfade + sticky viewport ===== */
.intro{
  position:relative;

  /* height set dynamically by JS */
  background:#fffaf6;
}

.intro-sticky{
  position:sticky;
  top:0;

  width:100%;
  height:100vh;
  height:100dvh;

  overflow:hidden;
  background:#fffaf6;
}

.intro-photo{
  position:absolute;
  inset:0;

  opacity:0;
  will-change:opacity;
}

.intro-photo img{
  width:100%;
  height:100%;

  object-fit:cover;
  object-position:center 40%;

  transform:scale(1.04);
  transform-origin:center center;

  will-change:transform;

  pointer-events:none;
  user-select:none;
}

.intro-dim{
  position:absolute;
  inset:0;

  background:transparent;
  pointer-events:none;

  z-index:2;
}

.hero-info{
  position:absolute;
  inset:0;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-end;

  padding-bottom:14%;

  text-align:center;
  color:#fff;

  pointer-events:none;

  opacity:0;
  transform:translateY(18px);

  z-index:3;

  text-shadow:
    0 2px 16px rgba(0,0,0,.5);
}

.info-inner{
  position:relative;
  width:100%;
  min-height:160px;
}

.info-eyebrow{
  position:absolute;
  top:-50px;
  left:50%;
  width:100%;
  transform:translateX(-50%);

  font-family:"나눔손글씨 엉겅퀴체","나눔손글씨엉겅퀴체","nanum-handwritting-eonggeongkwiche",cursive;
  font-size:
    clamp(42px, 12vw, 55px);
  letter-spacing:0;
  color:#fff;
  text-transform:none;
  opacity:0;
}

.info-details{
  position:absolute;
  top:-40px;
  left:50%;
  width:100%;
  transform:translateX(-50%);

  display:flex;
  flex-direction:column;
  align-items:center;
  gap:18px;
  opacity:0;
}

.info-names{
  font-family:'Gowun Batang',serif;
  font-weight:300;

  font-size:
    clamp(22px, 6.4vw, 30px);

  letter-spacing:.12em;
}

.info-divider{
  width:24px;
  height:1px;
  background:rgba(255,255,255,.5);
}

.info-meta{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.info-date{
  font-family:'Gowun Batang',serif;
  font-weight:300;

  font-size:
    clamp(15px, 4.4vw, 19px);

  letter-spacing:.05em;
}

.info-place{

.info-address{

.info-place + .info-address{

.intro-hint{

/* ===== Story (boy / girl) ===== */
.story{

.story-section{

  height:200vh;

.story-sticky{

  height:100vh;

.story-row{

.story-row.left{

}

.story-row.right{

}

.story-face{
  flex:0 0 auto;

  max-width:170px;
  aspect-ratio:3/4;

  object-fit:cover;

  border-radius:14px;

    0 10px 24px rgba(0,0,0,.16);

  opacity:0;
  transform:translateY(18px);

  transition:
    opacity .65s ease,
    transform .65s ease;
}

.story-face.show{

}

.story-bubble{
  position:relative;

  flex:0 1 auto;
  max-width:60%;

  background:#fff;

  border-radius:16px;
  padding:16px 18px;

  font-size:14px;
  line-height:1.8;
  color:#3a322c;

  box-shadow:
    0 6px 18px rgba(0,0,0,.08);

  opacity:0;
  transform:translateX(-12px) scale(.96);

  transition:
    opacity .55s ease,
    transform .55s ease;
}

.story-row.right .story-bubble{
  transform:translateX(12px) scale(.96);
}

.story-bubble.show{
  opacity:1;
  transform:translateX(0) scale(1);
}

.story-row.left .story-bubble::before{
  content:"";
  position:absolute;
  left:-9px;
  top:26px;

  border:9px solid transparent;
  border-left:0;

}

.story-row.right .story-bubble::before{
  content:"";

}

.story-name{
  display:block;
  font-family:'Gowun Batang',serif;
  font-size:12px;
  color:#a07c5b;
  letter-spacing:.18em;
  margin-bottom:6px;
}

</style>

<script>

const intro =
  document.getElementById(
    "intro"
  );

const introPhotos =
  document.querySelectorAll(
    ".intro-photo"
  );

const introHint =
  document.getElementById(
    "introHint"
  );

const N_INTRO = introPhotos.length;
const TEXT_SEQUENCE_TRIGGER = 0.74;
const TEXT_FADE_MS = 450;
const GREETING_HOLD_MS = 500;
const DETAILS_HOLD_MS = 500;
const GREETING_SCROLL_FADE = 0.08;
const INTRO_OUTRO_FADE_MS = 450;
const FINAL_PHOTO_FADE_PX = 500;
let introTextState = "idle";
let introTextStateStartedAt = 0;
let greetingOutStartProgress = 0;
let detailsBrakeActive = false;

intro.style.height =
  `${N_INTRO * 40 + 150}vh`;

const heroInfo =
  document.getElementById(
    "heroInfo"
  );

const infoEyebrow =
  document.querySelector(
    ".info-eyebrow"
  );

const infoDetails =
  document.querySelector(
    ".info-details"
  );

function getIntroProgress(){
  const rect =
    intro.getBoundingClientRect();

  const scrollable =
    intro.offsetHeight -
    window.innerHeight;

  return clamp(
    -rect.top / Math.max(scrollable, 1),
    0,
    1
  );
}

function shouldBlockIntroTextAdvance(){
  return introTextState === "greetingHold" ||
    introTextState === "detailsHold" ||
    introTextState === "introOutro";
}

function startIntroTextSequenceIfNeeded(){
  if(introTextState === "idle"){
    setIntroTextState("greetingIn");
  }
}

function blockDetailsBrakeScroll(event){
  if(introTextState === "done"){
    setIntroTextState("introOutro");
    event.preventDefault();
    return;
  }

  if(!shouldBlockIntroTextAdvance()) return;

  startIntroTextSequenceIfNeeded();
  event.preventDefault();
}

function blockDetailsBrakeKeys(event){
  const scrollKeys = [
    " ",
    "ArrowDown",
    "ArrowUp",
    "PageDown",
    "PageUp",
    "Home",
    "End",
  ];

  if(!scrollKeys.includes(event.key)) return;
  if(introTextState === "done"){
    setIntroTextState("introOutro");
    event.preventDefault();
    return;
  }

  if(!shouldBlockIntroTextAdvance()) return;

  startIntroTextSequenceIfNeeded();
  event.preventDefault();
}

function clamp(v,min,max){

  return Math.min(
    Math.max(v,min),
    max
  );
}

function lerp(progress, a, b, from, to){

  if(b <= a){
    return progress >= a ? to : from;
  }

  if(progress <= a) return from;
  if(progress >= b) return to;

  const t = (progress - a) / (b - a);
  return from + (to - from) * t;
}

function smoothstep(t){
  return t * t * (3 - 2 * t);
}

function setIntroTextState(nextState){
  introTextState = nextState;
  introTextStateStartedAt = performance.now();
  if(nextState === "greetingOut"){
    greetingOutStartProgress = getIntroProgress();
  }
  detailsBrakeActive =
    nextState !== "idle" &&
    nextState !== "done";
  requestAnimationFrame(update);
}

function updateIntro(){

  const rect =
    intro.getBoundingClientRect();

  const scrollable =
    intro.offsetHeight -
    window.innerHeight;

  let progress =
    clamp(
      -rect.top / Math.max(scrollable, 1),
      0,
      1
    );

  const introTop =
    window.scrollY + rect.top;
  const photoStep = 0.72 / N_INTRO;
  const finalPhotoIndex = N_INTRO - 1;
  const finalPhotoFadeStart =
    finalPhotoIndex * photoStep - photoStep * 0.35;
  const finalPhotoFadeEnd =
    finalPhotoFadeStart +
    FINAL_PHOTO_FADE_PX / Math.max(scrollable, 1);
  const textSequenceTrigger =
    Math.min(finalPhotoFadeEnd + 0.005, 0.86);
  const sequenceGateY =
    introTop + scrollable * textSequenceTrigger;

  if(
    progress >= textSequenceTrigger &&
    introTextState === "idle"
  ){
    setIntroTextState("greetingIn");
  }

  if(
    progress >= textSequenceTrigger &&
    (
      introTextState === "greetingIn" ||
      introTextState === "greetingHold" ||
      introTextState === "detailsIn" ||
      introTextState === "detailsHold" ||
      introTextState === "introOutro"
    )
  ){
    window.scrollTo(0, sequenceGateY);
    progress = textSequenceTrigger;
  }

  /* Scroll hint fades out almost immediately */
  introHint.style.opacity =
    lerp(progress, 0, 0.06, 1, 0);

  introPhotos.forEach((el, i)=>{

    const isFirst = i === 0;

    /* Wider fade-in window + ease curve for a smoother crossfade.
       Previous photos stay at opacity 1 underneath, so the next
       photo simply blends in from 0 -> 1 on top of them. */
    const isFinalPhoto = i === finalPhotoIndex;

    const fadeInStart =
      isFirst ? 0 :
        isFinalPhoto ? finalPhotoFadeStart :
        i * photoStep - photoStep * 0.35;
    const fadeInEnd =
      isFirst ? 0 :
        isFinalPhoto ? finalPhotoFadeEnd :
        i * photoStep + photoStep * 0.35;

    const linear = isFirst
      ? 1
      : lerp(progress, fadeInStart, fadeInEnd, 0, 1);

    el.style.opacity =
      smoothstep(linear);
  });

  if(progress < textSequenceTrigger - 0.04){
    introTextState = "idle";
    introTextStateStartedAt = 0;
    detailsBrakeActive = false;
  }

  const now = performance.now();
  const elapsed =
    introTextStateStartedAt
      ? now - introTextStateStartedAt
      : 0;

  let greetingOp = 0;
  let detailsOp = 0;

  if(introTextState === "greetingIn"){
    const t =
      clamp(elapsed / TEXT_FADE_MS, 0, 1);

    greetingOp = smoothstep(t);

    if(t >= 1){
      setIntroTextState("greetingHold");
      greetingOp = 1;
    }else{
      requestAnimationFrame(update);
    }
  }else if(introTextState === "greetingHold"){
    greetingOp = 1;

    if(elapsed >= GREETING_HOLD_MS){
      setIntroTextState("greetingOut");
    }else{
      requestAnimationFrame(update);
    }
  }else if(introTextState === "greetingOut"){
    const t =
      clamp(
        (progress - greetingOutStartProgress) /
          GREETING_SCROLL_FADE,
        0,
        1
      );

    greetingOp = 1 - smoothstep(t);

    if(t >= 1){
      setIntroTextState("detailsIn");
      greetingOp = 0;
    }
  }else if(introTextState === "detailsIn"){
    const t =
      clamp(elapsed / TEXT_FADE_MS, 0, 1);

    detailsOp = smoothstep(t);

    if(t >= 1){
      setIntroTextState("detailsHold");
      detailsOp = 1;
    }else{
      requestAnimationFrame(update);
    }
  }else if(introTextState === "detailsHold"){
    detailsOp = 1;

    if(elapsed >= DETAILS_HOLD_MS){
      setIntroTextState("done");
      detailsOp = 1;
    }else{
      requestAnimationFrame(update);
    }
  }else if(introTextState === "done"){
    detailsOp = 1;
  }else if(introTextState === "introOutro"){
    detailsOp = 1;
  }else if(introTextState === "finished"){
    detailsOp = 1;
  }

  let introOutroOp = 1;

  if(introTextState === "introOutro"){
    const t =
      clamp(
        elapsed / INTRO_OUTRO_FADE_MS,
        0,
        1
      );

    introOutroOp = 1 - smoothstep(t);

    if(t >= 1){
      setIntroTextState("finished");
      introOutroOp = 0;
      window.scrollTo(0, introTop + scrollable + 1);
    }
  }else if(introTextState === "finished"){
    introOutroOp = 0;
  }

  const infoY =
    introTextState === "idle"
      ? 18
      : 0;

  heroInfo.style.opacity =
    Math.max(greetingOp, detailsOp);
  infoEyebrow.style.opacity = greetingOp;
  infoDetails.style.opacity = detailsOp;
  heroInfo.style.transform =
    `translateY(${infoY}px)`;
  document.querySelector(".intro-sticky").style.opacity =
    introOutroOp;
}

function update(){

  updateIntro();

  updateStory();
}

window.addEventListener(
  "scroll",
  update,
  {passive:true}
);

window.addEventListener(
  "wheel",
  blockDetailsBrakeScroll,
  {passive:false}
);

window.addEventListener(
  "touchmove",
  blockDetailsBrakeScroll,
  {passive:false}
);

window.addEventListener(
  "keydown",
  blockDetailsBrakeKeys
);

window.addEventListener(
  "resize",
  update
);

/* ===== D-day countdown ===== */
const weddingTs =
  new Date(
    "2026-06-27T17:00:00+09:00"
  ).getTime();

const ddayDays =
  document.getElementById("ddayDays");
const ddayHours =
  document.getElementById("ddayHours");
const ddayMins =
  document.getElementById("ddayMins");
const ddaySecs =
  document.getElementById("ddaySecs");
const ddayCount =
  document.getElementById("ddayCount");
const ddayMsg =
  document.getElementById("ddayMsg");

function pad(n){
  return String(n).padStart(2,"0");
}

function tickDday(){

  const now = Date.now();
  const diff = weddingTs - now;

  if(diff <= 0){
    ddayDays.textContent = "00";
    ddayHours.textContent = "00";
    ddayMins.textContent = "00";
    ddaySecs.textContent = "00";
    ddayMsg.innerHTML =
      "오늘은 정호 ♡ 엔지의 결혼식 날입니다.";
    return;
  }

  const sec =
    Math.floor(diff / 1000);

  const days =
    Math.floor(sec / 86400);
  const hours =
    Math.floor((sec % 86400) / 3600);
  const mins =
    Math.floor((sec % 3600) / 60);
  const secs =
    sec % 60;

  ddayDays.textContent = pad(days);
  ddayHours.textContent = pad(hours);
  ddayMins.textContent = pad(mins);
  ddaySecs.textContent = pad(secs);

  if(ddayCount){
    ddayCount.textContent = days;
  }
}

tickDday();
setInterval(tickDday, 1000);

/* ===== Story scroll-driven bubble reveal ===== */
const storySections =
  document.querySelectorAll(".story-section");

function updateStory(){
  storySections.forEach((sec)=>{

    const rect =
      sec.getBoundingClientRect();

    const scrollable =
      sec.offsetHeight -
      window.innerHeight;

    const progress =
      clamp(
        -rect.top / Math.max(scrollable,1),
        0,
        1
      );

    const bubble =
      sec.querySelector(".story-bubble");
    const face =
      sec.querySelector(".story-face");

    if(!bubble || !face) return;

    if(progress > 0.25){
      face.classList.add("show");
      bubble.classList.add("show");
    }else{
      face.classList.remove("show");
      bubble.classList.remove("show");
    }
  });
}

update();

</script>
