<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>김정호 · 안젤리카 모바일 청첩장</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

html,body{
  overflow-x:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  background:#fffaf6;
  color:#2f2a26;
}

.intro{
  height:500vh;
  position:relative;
  background:#000;
}

.intro-fixed{
  position:fixed;
  inset:0;
  width:100%;
  height:100vh;
  overflow:hidden;
  z-index:10;
  background:#000;
  transition:opacity .8s ease;
}

.intro-img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center center;
  opacity:0;
  transition:opacity .35s ease;
}

.intro-img.active{opacity:1}

.hero-scroll{
  height:200vh;
  position:relative;
}

.hero-fixed{
  position:fixed;
  inset:0;
  width:100%;
  height:100vh;
  overflow:hidden;
  z-index:1;
  background:#fffaf6;
}

.hero-photo{
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center top;
  transform:scale(1);
  transform-origin:center top;
  will-change:transform;
}

.invite-text{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:100%;
  text-align:center;
  color:white;
  opacity:0;
  font-size:clamp(34px,8vw,60px);
  font-weight:300;
  letter-spacing:0.2em;
  text-shadow:0 2px 20px rgba(0,0,0,.45);
  z-index:2;
}

.scroll-guide{
  position:absolute;
  left:50%;
  bottom:38px;
  transform:translateX(-50%);
  z-index:20;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
  color:white;
  opacity:.9;
  animation:bounce 1.8s infinite;
}

.scroll-guide span{
  font-size:13px;
  letter-spacing:.15em;
}

.arrow{
  width:14px;
  height:14px;
  border-right:1.5px solid white;
  border-bottom:1.5px solid white;
  transform:rotate(45deg);
}

@keyframes bounce{
  0%,100%{transform:translateX(-50%) translateY(0)}
  50%{transform:translateX(-50%) translateY(6px)}
}

.content{
  position:relative;
  z-index:3;
  max-width:720px;
  margin:0 auto;
  padding:80px 24px 120px;
  text-align:center;
  background:#fffaf6;
  line-height:1.8;
}

.names{
  font-size:30px;
  letter-spacing:.08em;
  margin-bottom:20px;
}

.date{
  font-size:20px;
  color:#7d736b;
  margin-bottom:40px;
}

.place{
  margin-top:36px;
  font-size:18px;
}

.address{
  font-size:15px;
  color:#756c64;
}
</style>
</head>

<body>

<section class="intro" id="intro">
  <div class="intro-fixed" id="introFixed">
    <img src="./run1.jpg" class="intro-img active">
    <img src="./run2.jpg" class="intro-img">
    <img src="./run3.jpg" class="intro-img">
    <img src="./run4.jpg" class="intro-img">

    <div class="scroll-guide" id="introGuide">
      <span>아래로 내려주세요</span>
      <div class="arrow"></div>
    </div>
  </div>
</section>

<section class="hero-scroll" id="hero">
  <div class="hero-fixed" id="heroFixed">
    <img src="./photo.jpg" class="hero-photo" id="heroPhoto" alt="wedding photo">

    <div class="invite-text" id="inviteText">
      초대합니다
    </div>

    <div class="scroll-guide" id="heroGuide">
      <span>아래로 내려주세요</span>
      <div class="arrow"></div>
    </div>
  </div>
</section>

<main class="content">
  <div class="names">김정호 · 안젤리카</div>
  <div class="date">2026년 6월 27일</div>

  <p>
    서로의 삶에 따뜻한 동행이 되어<br>
    새로운 시작을 함께하려 합니다.
  </p>

  <p style="margin-top:20px;">
    소중한 걸음으로 함께해 주시면<br>
    더없는 기쁨으로 간직하겠습니다.
  </p>

  <div class="place">아이라이크마운틴</div>
  <div class="address">경기도 고양시 덕양구 고양대로 2002번길 29</div>
</main>

<script>
const intro = document.getElementById("intro");
const introFixed = document.getElementById("introFixed");
const introImgs = document.querySelectorAll(".intro-img");
const introGuide = document.getElementById("introGuide");

const hero = document.getElementById("hero");
const heroFixed = document.getElementById("heroFixed");
const photo = document.getElementById("heroPhoto");
const text = document.getElementById("inviteText");
const heroGuide = document.getElementById("heroGuide");

function clamp(v,min,max){
  return Math.min(Math.max(v,min),max);
}

function updateIntro(){
  const rect = intro.getBoundingClientRect();
  const scrollable = intro.offsetHeight - window.innerHeight;
  const progress = clamp(-rect.top / scrollable, 0, 1);

  const imageProgress = clamp(progress / 0.8, 0, 1);
  const index = Math.min(3, Math.floor(imageProgress * 4));

  introImgs.forEach((img,i)=>{
    img.classList.toggle("active", i === index);
  });

  introGuide.style.opacity = String(1 - progress * 1.3);

  if(progress >= 0.8){
    const fadeProgress = clamp((progress - 0.8) / 0.2, 0, 1);
    introFixed.style.opacity = String(1 - fadeProgress);
    introFixed.style.pointerEvents = "none";
  }else{
    introFixed.style.opacity = "1";
    introFixed.style.pointerEvents = "auto";
  }

  introFixed.style.position = "fixed";
  introFixed.style.top = "0";
  introFixed.style.bottom = "auto";
}

function updateHero(){
  const rect = hero.getBoundingClientRect();
  const scrollable = hero.offsetHeight - window.innerHeight;
  const progress = clamp(-rect.top / scrollable, 0, 1);

  photo.style.transform = `scale(${1 + progress * 0.5})`;

  const textProgress = clamp((progress - 0.45) / 0.35, 0, 1);
  text.style.opacity = textProgress;

  heroGuide.style.opacity = String(1 - progress * 1.8);

  if(progress >= 0.995){
    heroFixed.style.position = "absolute";
    heroFixed.style.top = "auto";
    heroFixed.style.bottom = "0";
  }else{
    heroFixed.style.position = "fixed";
    heroFixed.style.top = "0";
    heroFixed.style.bottom = "auto";
  }
}

function update(){
  updateIntro();
  updateHero();
}

window.addEventListener("scroll", update, {passive:true});
window.addEventListener("resize", update);
update();
</script>

</body>
</html>
