<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>김정호 · 안젤리카 모바일 청첩장</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; color: #2f2a26; background: #fffaf6; }
    body { overflow-x: hidden; }

    .hero-scroll {
      position: relative;
      height: 220vh;
      background: #000;
    }

    .hero-sticky {
      position: sticky;
      top: 0;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background: #000;
    }

    .hero-photo {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background-image: url("data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDL/2wBDAQkJCQwLDBgNDRgyIRwhMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjL/wAARCAMgBAADASIAAhEBAxEB/8QAHQAAAQQDAQEAAAAAAAAAAAAABQYDBAcCAQgJCP/EAFIQAAEDAgMEBQYDBQQIBQUAAAECAwQFEQASITEGE0FRImFxgZEUMqGxByNCUrHB0RUjYnKS8BUWQ1NzgpOiwvE0Q5PC4f/EABoBAQADAQEBAAAAAAAAAAAAAAABAgMEBQb/xAAuEQEAAgIBAwMCBgMBAAAAAAAAAQIDEQQSITEFE0FRImFxgZGx0SIyQmKB4f/aAAwDAQACEQMRAD8A+0REQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERA//Z");
      background-size: cover;
      background-position: center 35%;
      transform: scale(1);
      transform-origin: center center;
      will-change: transform;
    }

    .hero-dim {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0);
      will-change: background;
    }

    .invite-text {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      padding: 0 24px;
      text-align: center;
      color: #fff;
      opacity: 0;
      letter-spacing: 0.18em;
      font-size: clamp(28px, 8vw, 54px);
      font-weight: 300;
      text-shadow: 0 2px 18px rgba(0,0,0,.45);
      will-change: opacity, transform;
    }

    .scroll-hint {
      position: absolute;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%);
      color: rgba(255,255,255,.82);
      font-size: 12px;
      letter-spacing: .16em;
      opacity: .9;
    }

    .content {
      max-width: 720px;
      margin: 0 auto;
      padding: 76px 24px 100px;
      text-align: center;
      line-height: 1.8;
    }

    .names {
      font-size: 28px;
      letter-spacing: .08em;
      margin-bottom: 24px;
    }

    .date {
      font-size: 20px;
      color: #7d736b;
      margin-bottom: 36px;
    }

    .place {
      font-size: 18px;
      margin-top: 32px;
    }

    .address {
      color: #756c64;
      font-size: 15px;
    }

    .button {
      display: inline-block;
      margin-top: 26px;
      padding: 13px 22px;
      border: 1px solid #c8b9ab;
      border-radius: 999px;
      color: #3b342e;
      text-decoration: none;
      font-size: 14px;
      background: rgba(255,255,255,.45);
    }
  </style>
</head>
<body>

  <section class="hero-scroll" id="hero">
    <div class="hero-sticky">
      <div class="hero-photo" id="heroPhoto"></div>
      <div class="hero-dim" id="heroDim"></div>
      <div class="invite-text" id="inviteText">초대합니다</div>
      <div class="scroll-hint" id="scrollHint">SCROLL</div>
    </div>
  </section>

  <main class="content">
    <div class="names">김정호 · 안젤리카</div>
    <div class="date">2026년 6월 27일</div>

    <p>
      서로의 삶에 따뜻한 동행이 되어<br>
      새로운 시작을 함께하려 합니다.
    </p>
    <p>
      소중한 걸음으로 함께해 주시면<br>
      더없는 기쁨으로 간직하겠습니다.
    </p>

    <div class="place">아이라이크마운틴</div>
    <div class="address">경기도 고양시 덕양구 고양대로 2002번길 29</div>

    <a class="button" href="https://map.kakao.com/?q=경기도 고양시 덕양구 고양대로 2002번길 29" target="_blank" rel="noopener">
      지도 보기
    </a>
  </main>

  <script>
    const hero = document.getElementById("hero");
    const photo = document.getElementById("heroPhoto");
    const dim = document.getElementById("heroDim");
    const text = document.getElementById("inviteText");
    const hint = document.getElementById("scrollHint");

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function updateHero() {
      const rect = hero.getBoundingClientRect();
      const scrollable = hero.offsetHeight - window.innerHeight;
      const progress = clamp(-rect.top / scrollable, 0, 1);

      const scale = 1 + progress * 0.5;
      photo.style.transform = `scale(${scale})`;

      const textProgress = clamp((progress - 0.45) / 0.35, 0, 1);
      text.style.opacity = textProgress;
      text.style.transform = `translate(-50%, calc(-50% + ${20 - textProgress * 20}px))`;

      dim.style.background = `rgba(0,0,0,${textProgress * 0.28})`;
      hint.style.opacity = String(1 - progress * 1.8);
    }

    window.addEventListener("scroll", updateHero, { passive: true });
    window.addEventListener("resize", updateHero);
    updateHero();
  </script>
</body>
</html>
